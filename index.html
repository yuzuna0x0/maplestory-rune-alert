<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>찍계는 안된다이~~~</title>
  <style>
    :root {
      --bg:#12111a; --panel:#1a1925; --panel2:#232233; --line:#2d2b3e;
      --text:#ece9f5; --muted:#8f8ba6; --accent:#c26be6; --alert:#ff3b30;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      font-size: 14px;
    }
    .app { max-width: 1360px; margin: 0 auto; padding: 20px 28px 24px; }
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .top h1 { margin: 0 14px 0 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
    .top .left, .top .right { display: flex; align-items: center; gap: 10px; }
    .share { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted);
      padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; }
    .share i { width: 8px; height: 8px; border-radius: 50%; background: #5b5870; }
    .share.on { color: var(--text); border-color: #3c6b4a; }
    .share.on i { background: #4ade80; box-shadow: 0 0 8px #4ade80; }

    button {
      padding: 7px 14px; cursor: pointer; font: inherit; color: var(--text);
      background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
      transition: background-color .12s, border-color .12s;
    }
    button:hover { background: #2d2c40; border-color: #44425c; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #1a0f20; font-weight: 700; }
    button.primary:hover { background: #d07df0; }
    button.danger { color: #ff8b84; border-color: #5a2a2a; background: #2a1a1f; }
    button.danger:hover { background: #3a2026; }
    button.active { border-color: var(--accent); background: #3a2447; }
    button.wide { width: 100%; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
    .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

    .status-box {
      display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center; min-height: 170px; padding: 24px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      cursor: pointer; user-select: none; transition: background-color .08s linear, box-shadow .2s, border-color .2s;
    }
    .status-box:hover { border-color: #4a4863; }
    .status-box.found { border-color: var(--alert); box-shadow: 0 0 0 1px var(--alert), 0 0 36px rgba(255, 59, 48, .35); }
    #statusText { font-weight: 800; font-size: 56px; line-height: 1.15; white-space: nowrap; letter-spacing: -0.02em; }

    #subText { min-height: 1.3em; font-size: 20px; font-weight: 600; color: var(--muted);
      font-variant-numeric: tabular-nums; white-space: nowrap; }
    .infobar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .meta { font-size: 13px; color: var(--muted); }
    .infobar .meta + .meta { margin-top: 4px; }
    .fontctl { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
    .fontctl input { width: 120px; }

    .stage-wrap { position: relative; display: inline-block; align-self: flex-start;
      border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #0b0a10; }
    video { display: block; max-width: 820px; max-height: 460px; }
    #selBox { position: absolute; border: 2px solid var(--alert); background: rgba(255, 59, 48, .15);
      display: none; pointer-events: none; }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px 8px; }
    .card h2 { margin: 0 0 6px; font-size: 14px; font-weight: 700; }
    .row { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 10px; margin: 0 0 12px; }
    .row > label, .row > .lbl { color: var(--muted); font-size: 13px; }
    .ctl { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .unit { color: var(--muted); font-size: 12px; }
    input[type="number"] { width: 84px; padding: 5px 8px; font: inherit; color: var(--text);
      background: var(--bg); border: 1px solid var(--line); border-radius: 5px; }
    input[type="range"] { accent-color: var(--accent); flex: 1; min-width: 0; }
    input[type="color"] { width: 36px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 5px; background: none; cursor: pointer; }
    input[type="file"] { width: 100%; font-size: 12px; color: var(--muted); }
    input[type="file"]::file-selector-button { margin-right: 8px; padding: 5px 10px; font: inherit; color: var(--text);
      background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; cursor: pointer; }
    .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid #777; }
    #rgbText { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .preview-box { width: 100%; height: 120px; background: #0b0a10; border: 1px solid var(--line);
      border-radius: 5px; overflow: hidden; }
    .preview { display: block; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; cursor: crosshair; }
    .lbl small { color: #6f6b86; font-size: 11px; }
    .stack { margin: 0 0 12px; }
    .stack .lbl { display: block; margin-bottom: 6px; color: var(--muted); font-size: 13px; }
    .stack .ctl { margin-top: 8px; }

    .footer { margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--line);
      font-size: 12px; color: #6b6882; text-align: center; }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="left">
        <h1>찍계는 안된다이~~~</h1>
        <span class="share" id="shareState"><i></i><b>공유 중지됨</b></span>
      </div>
      <div class="right">
        <button id="popupBtn" type="button">별도 상태 창 열기</button>
        <button id="stopBtn" class="danger">중지</button>
        <button id="startBtn" class="primary">화면 공유 시작</button>
      </div>
    </header>

    <div class="layout">
      <div class="col">
        <div class="status-box" id="statusBox" title="클릭하면 별도 상태 창이 열립니다">
          <div id="statusText">룬 없음</div>
          <div id="subText"></div>
        </div>

        <div class="infobar">
          <div>
            <div class="meta" id="liveCountInfo">감지된 픽셀: 0 px | 스캔주기: 1000 ms</div>
            <div class="meta" id="regionInfo">선택 영역: (0, 50) 크기 114x48 (공유 시작 시 적용, 변경하려면 시작 후 공유된 비디오에서 드래그 하세요 )</div>
          </div>
          <div class="fontctl">
            <label for="fontRange">글씨 크기</label>
            <input id="fontRange" type="range" min="14" max="144" value="56" />
            <span id="fontSizeText">56px</span>
          </div>
        </div>

        <div class="stage-wrap" id="stageWrap">
          <video id="video" autoplay muted playsinline></video>
          <div id="selBox"></div>
        </div>
      </div>

      <div class="col">
        <section class="card">
          <h2>감지 설정</h2>
          <div class="row">
            <span class="lbl">목표 색깔</span>
            <div class="ctl">
              <input id="colorPicker" type="color" value="#d46df0" title="직접 색상 선택" />
              <button id="eyedropBtn" type="button" title="공유 화면에서 색을 직접 찍어서 선택">스포이드</button>
              <span class="swatch" id="rgbSwatch" style="background: rgb(212, 109, 240);"></span>
              <span id="rgbText">212, 109, 240</span>
            </div>
          </div>
          <div class="row">
            <label for="tolInput">오차</label>
            <div class="ctl"><input id="tolInput" type="number" min="0" max="200" value="5" /><span class="unit">±</span></div>
          </div>
          <div class="row">
            <label for="minPxInput">최소 픽셀</label>
            <div class="ctl"><input id="minPxInput" type="number" min="1" max="10000" value="5" /><span class="unit">px</span></div>
          </div>
          <div class="row">
            <label for="intervalInput">스캔 간격</label>
            <div class="ctl"><input id="intervalInput" type="number" min="20" max="10000" step="50" value="1000" /><span class="unit">ms</span></div>
          </div>
          <div class="stack">
            <span class="lbl">선택 영역 미리보기 <small>(클릭하면 그 픽셀 색으로 지정)</small></span>
            <div class="preview-box">
              <canvas id="previewCanvas" class="preview" width="114" height="48"></canvas>
            </div>
          </div>
        </section>

        <section class="card">
          <h2>알림 설정</h2>
          <div class="stack">
            <label class="lbl" for="audioFile">알림 소리</label>
            <input id="audioFile" type="file" accept="audio/*" />
            <div class="ctl">
              <button id="testSoundBtn" type="button">미리 듣기</button>
              <span class="meta" id="audioSourceInfo"></span>
            </div>
          </div>
          <div class="row">
            <label for="repeatInput">반복 횟수</label>
            <div class="ctl"><input id="repeatInput" type="number" min="1" max="50" value="2" /><span class="unit">회</span></div>
          </div>
          <div class="row">
            <label for="volumeRange">볼륨</label>
            <div class="ctl"><input id="volumeRange" type="range" min="0" max="100" value="70" /><span id="volumeText">70%</span></div>
          </div>
          <div class="row">
            <label for="remindSecInput">재알림 간격</label>
            <div class="ctl"><input id="remindSecInput" type="number" min="0" max="600" value="30" /><span class="unit">초 (0=끔)</span></div>
          </div>
        </section>

        <section class="card">
          <h2>룬 타이머</h2>
          <div class="row">
            <label for="cycleMinInput">룬 주기</label>
            <div class="ctl"><input id="cycleMinInput" type="number" min="1" max="120" value="15" /><span class="unit">분</span></div>
          </div>
          <div class="stack">
            <div class="ctl">
              <button id="cycleStartBtn" type="button" title="지금 시점부터 다음 룬 카운트다운 시작">지금부터 시작</button>
              <button id="cycleClearBtn" type="button" title="카운트다운 표시 끄기">카운트다운 끄기</button>
            </div>
          </div>
        </section>

        <button id="resetBtn" class="wide" type="button">기본값으로 초기화</button>
      </div>
    </div>

    <canvas id="scanCanvas" style="display:none;"></canvas>
    <audio id="alertAudio"></audio>

    <div class="footer">made by Claude, gemini with yuzuna0x0</div>
  </div>

  <script>
    // HTML 파일과 같은 폴더에 둘 기본 오디오 파일 경로
    const DEFAULT_AUDIO_SRC = "./alert.mp3";

    // 선택 영역 좌표 기본값
    const DEFAULT_PX_REGION = {
      x: 0,
      y: 50,
      w: 114,
      h: 48
    };


    const video = document.getElementById("video");
    const stageWrap = document.getElementById("stageWrap");
    const selBox = document.getElementById("selBox");
    const statusBox = document.getElementById("statusBox");
    const statusText = document.getElementById("statusText");
    const regionInfo = document.getElementById("regionInfo");
    const REGION_INFO_DEFAULT_TEXT = regionInfo.textContent;
    const liveCountInfo = document.getElementById("liveCountInfo");
    const colorPicker = document.getElementById("colorPicker");
    const eyedropBtn = document.getElementById("eyedropBtn");
    const popupBtn = document.getElementById("popupBtn");
    const rgbSwatch = document.getElementById("rgbSwatch");
    const rgbText = document.getElementById("rgbText");
    const intervalInput = document.getElementById("intervalInput");
    const fontRange = document.getElementById("fontRange");
    const fontSizeText = document.getElementById("fontSizeText");
    const audioFileInput = document.getElementById("audioFile");
    const audioSourceInfo = document.getElementById("audioSourceInfo");
    const testSoundBtn = document.getElementById("testSoundBtn");
    const repeatInput = document.getElementById("repeatInput");
    const volumeRange = document.getElementById("volumeRange");
    const volumeText = document.getElementById("volumeText");
    const alertAudio = document.getElementById("alertAudio");
    const scanCanvas = document.getElementById("scanCanvas");
    const scanCtx = scanCanvas.getContext("2d", { willReadFrequently: true });
    const previewCanvas = document.getElementById("previewCanvas");
    const previewCtx = previewCanvas.getContext("2d");

    let stream = null;
    let timerId = null;
    let blinkTimerId = null;
    let blinkWhite = false;
    let eyedropMode = false;
    let dragging = false;
    let dragStart = { x: 0, y: 0 };
    let normRegion = null;
    let targetRgb = [212, 109, 240];
    let prevFound = false;
    let remainingRepeats = 0;
    let audioObjectUrl = null;
    let popupWin = null;
    let popupLabel = null;
    let currentFound = false;

    // 감지가 이 횟수만큼 연속으로 끊겨야 "룬 없음"으로 바꿈 (1이면 즉시 반영)
    const MISS_TOLERANCE = 2;
    let missCount = 0;
    let foundSinceTs = null;   // 현재 룬이 처음 감지된 시각(ms)
    let nextRuneAt = null;     // 다음 룬 예정 시각(ms)
    let popupSub = null;
    const subText = document.getElementById("subText");
    let lastAlertAt = 0;

    const remindSecInput = document.getElementById("remindSecInput");

    // 백그라운드 탭에서도 타이머가 늦어지지 않도록 Web Worker로 틱을 발생시킴
    let tickWorker = null;
    let workerFailed = false;
    function applyDefaultPxRegion() {
      if (!DEFAULT_PX_REGION) return;
      const rect = video.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return;

      const x = Math.max(0, Math.min(rect.width - 1, DEFAULT_PX_REGION.x));
      const y = Math.max(0, Math.min(rect.height - 1, DEFAULT_PX_REGION.y));
      const w = Math.max(1, Math.min(rect.width - x, DEFAULT_PX_REGION.w));
      const h = Math.max(1, Math.min(rect.height - y, DEFAULT_PX_REGION.h));

      normRegion = {
        x: x / rect.width,
        y: y / rect.height,
        w: w / rect.width,
        h: h / rect.height
      };
      showRegion();
    }

    // normRegion(비율)을 현재 비디오 표시 크기에 맞춰 선택 박스로 표시
    function showRegion() {
      if (!normRegion) return;
      const rect = video.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return;
      const x = normRegion.x * rect.width;
      const y = normRegion.y * rect.height;
      const w = normRegion.w * rect.width;
      const h = normRegion.h * rect.height;
      selBox.style.left = `${x}px`;
      selBox.style.top = `${y}px`;
      selBox.style.width = `${w}px`;
      selBox.style.height = `${h}px`;
      selBox.style.display = "block";
      regionInfo.textContent = `선택 영역: (${Math.round(x)}, ${Math.round(y)}) 크기 ${Math.round(w)}x${Math.round(h)}`;
    }


    function initDefaultAudio() {
      if (!DEFAULT_AUDIO_SRC) {
        audioSourceInfo.textContent = "(파일 미선택)";
        return;
      }
      alertAudio.src = DEFAULT_AUDIO_SRC;
      alertAudio.load();
      audioSourceInfo.textContent = `(기본: ${DEFAULT_AUDIO_SRC})`;
    }
    initDefaultAudio();

    function startBlinkLoop() {
      if (blinkTimerId) return;
      blinkWhite = true;
      syncStatusDisplay();
      blinkTimerId = setInterval(() => {
        if (!currentFound) {
          stopBlinkLoop();
          return;
        }
        blinkWhite = !blinkWhite;
        syncStatusDisplay();
      }, 1000);
    }

    function stopBlinkLoop() {
      if (blinkTimerId) {
        clearInterval(blinkTimerId);
        blinkTimerId = null;
      }
      blinkWhite = false;
      syncStatusDisplay();
    }

    function syncStatusDisplay() {
      const text = currentFound ? "룬 쥐겨" : "룬 없음";
      const color = currentFound ? "#ff3b30" : "#ffffff";
      const fontSize = `${fontRange.value}px`;
      const boxBg = (currentFound && blinkWhite) ? "#ffffff" : "";
      const popBg = (currentFound && blinkWhite) ? "#ffffff" : "#141414";

      fontSizeText.textContent = fontSize;

      statusText.textContent = text;
      statusText.style.color = color;
      statusText.style.fontSize = fontSize;
      statusBox.style.backgroundColor = boxBg;
      statusBox.classList.toggle("found", currentFound);
      updateSubText();

      if (popupWin && !popupWin.closed && popupLabel) {
        popupLabel.textContent = text;
        popupLabel.style.color = color;
        popupLabel.style.fontSize = fontSize;
        popupWin.document.body.style.backgroundColor = popBg;
      }
    }

    function openOrFocusPopup() {
      if (popupWin && !popupWin.closed) {
        popupWin.focus();
        return;
      }

      popupWin = window.open(
        "",
        "RuneStatusPopup",
        "width=420,height=220,left=100,top=100,resizable=yes,scrollbars=no,toolbar=no,menubar=no,location=no,status=no"
      );

      if (!popupWin) {
        alert("브라우저 팝업 차단이 걸려 있어요. 팝업을 허용한 뒤 다시 눌러 주세요.");
        return;
      }

      popupWin.document.open();
      popupWin.document.write(`
        <!DOCTYPE html>
        <html lang="ko">
        <head>
          <meta charset="UTF-8" />
          <title>룬 상태</title>
          <style>
            html, body {
              margin: 0;
              padding: 0;
              width: 100%;
              height: 100%;
              background: #141414;
              display: flex;
              align-items: center;
              justify-content: center;
              flex-direction: column;
              font-family: "Malgun Gothic", sans-serif;
              overflow: hidden;
              transition: background-color 0.08s linear;
            }
            #popSub {
              margin-top: 8px;
              font-size: 20px;
              font-weight: 600;
              color: #8f8ba6;
              user-select: none;
              white-space: nowrap;
            }
            #popStatus {
              font-weight: bold;
              user-select: none;
              line-height: 1.15;
              white-space: nowrap;
            }
          </style>
        </head>
        <body>
          <div id="popStatus">룬 없음</div>
          <div id="popSub"></div>
        </body>
        </html>
      `);
      popupWin.document.close();
      popupLabel = popupWin.document.getElementById("popStatus");
      popupSub = popupWin.document.getElementById("popSub");
      syncStatusDisplay();
    }

    popupBtn.addEventListener("click", openOrFocusPopup);
    statusBox.addEventListener("click", openOrFocusPopup);

    function applyVolume() {
      const vol = Math.max(0, Math.min(1, Number(volumeRange.value) / 100));
      alertAudio.volume = vol;
      volumeText.textContent = `${Math.round(vol * 100)}%`;
    }
    applyVolume();

    volumeRange.addEventListener("input", applyVolume);

    audioFileInput.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (audioObjectUrl) {
        URL.revokeObjectURL(audioObjectUrl);
      }
      audioObjectUrl = URL.createObjectURL(file);
      alertAudio.src = audioObjectUrl;
      alertAudio.load();
      audioSourceInfo.textContent = `(선택: ${file.name})`;
    });

    function playSequence(count) {
      if (!alertAudio.src) return;
      remainingRepeats = Math.max(1, Number(count) || 1);
      alertAudio.pause();
      alertAudio.currentTime = 0;
      alertAudio.play().catch((err) => console.warn("오디오 재생 실패:", err));
    }

    alertAudio.addEventListener("ended", () => {
      remainingRepeats -= 1;
      if (remainingRepeats > 0) {
        alertAudio.currentTime = 0;
        alertAudio.play().catch((err) => console.warn("반복 재생 실패:", err));
      }
    });

    testSoundBtn.addEventListener("click", () => {
      if (!alertAudio.src) {
        alert("알림 소리 파일이 준비되지 않았어요. 같은 폴더에 기본 파일을 두거나 파일을 선택해 주세요.");
        return;
      }
      playSequence(repeatInput.value);
    });

    function setTargetRgb(r, g, b) {
      targetRgb = [r, g, b];
      rgbSwatch.style.background = `rgb(${r}, ${g}, ${b})`;
      rgbText.textContent = `${r}, ${g}, ${b}`;
      const hex = "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("");
      colorPicker.value = hex;
    }

    function getCurrentIntervalMs() {
      const val = Number(intervalInput.value);
      return Number.isFinite(val) && val >= 20 ? val : 1000;
    }

    function getTickWorker() {
      if (workerFailed) return null;
      if (tickWorker) return tickWorker;
      try {
        const src = `
          let id = null;
          onmessage = (e) => {
            if (e.data.cmd === "start") {
              clearInterval(id);
              id = setInterval(() => postMessage("tick"), e.data.ms);
            } else if (e.data.cmd === "stop") {
              clearInterval(id);
              id = null;
            }
          };
        `;
        const url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
        tickWorker = new Worker(url);
        tickWorker.onmessage = () => scanFrame();
        tickWorker.onerror = () => {
          console.warn("Worker 타이머 실패, setInterval로 대체합니다.");
          workerFailed = true;
          tickWorker = null;
          restartTimer();
        };
      } catch (err) {
        console.warn("Worker 생성 실패, setInterval로 대체합니다.", err);
        workerFailed = true;
        tickWorker = null;
      }
      return tickWorker;
    }

    function stopTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      if (tickWorker) {
        tickWorker.postMessage({ cmd: "stop" });
      }
    }

    function restartTimer() {
      stopTimer();
      if (!stream) return;
      const ms = getCurrentIntervalMs();
      const w = getTickWorker();
      if (w) {
        w.postMessage({ cmd: "start", ms });
      } else {
        timerId = setInterval(scanFrame, ms);
      }
    }

    // ===== 백그라운드 탭에서도 프레임을 받기 위한 트랙 프로세서 =====
    // <video> 요소는 탭이 가려지면 프레임 갱신이 멈출 수 있어서, 트랙에서 직접 프레임을 읽음
    let frameReader = null;
    let latestFrame = null;

    function stopFrameReader() {
      if (frameReader) {
        try { frameReader.cancel(); } catch (e) {}
        frameReader = null;
      }
      if (latestFrame) {
        try { latestFrame.close(); } catch (e) {}
        latestFrame = null;
      }
    }

    function startFrameReader(track) {
      stopFrameReader();
      if (typeof MediaStreamTrackProcessor === "undefined") return false;
      let reader;
      try {
        reader = new MediaStreamTrackProcessor({ track }).readable.getReader();
      } catch (e) {
        console.warn("프레임 리더 생성 실패:", e);
        return false;
      }
      frameReader = reader;
      (async () => {
        try {
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            if (reader !== frameReader) { value.close(); break; }
            if (latestFrame) latestFrame.close();
            latestFrame = value;
          }
        } catch (e) { /* 스트림 종료 */ }
      })();
      return true;
    }

    function getCycleMs() {
      const m = Number(document.getElementById("cycleMinInput").value);
      return (Number.isFinite(m) && m > 0 ? m : 15) * 60000;
    }

    function fmtMs(ms) {
      const t = Math.floor(Math.max(0, ms) / 1000);
      return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`;
    }

    // 방치 시간 / 다음 룬 카운트다운 표시 (메인 + 팝업)
    function updateSubText() {
      const now = Date.now();
      let text = "";
      if (currentFound && foundSinceTs) {
        text = `방치 ${fmtMs(now - foundSinceTs)}`;
      } else if (nextRuneAt) {
        const remain = nextRuneAt - now;
        text = remain >= 0 ? `다음 룬까지 ${fmtMs(remain)}` : `예정 시간 경과 +${fmtMs(-remain)}`;
      }
      const onWhite = currentFound && blinkWhite;
      subText.textContent = text;
      subText.style.color = onWhite ? "#333333" : "";
      if (popupWin && !popupWin.closed && popupSub) {
        popupSub.textContent = text;
        popupSub.style.color = onWhite ? "#333333" : "#8f8ba6";
      }
    }

    function setShareState(on, note = "") {
      const el = document.getElementById("shareState");
      el.classList.toggle("on", on);
      el.querySelector("b").textContent = on ? "화면 공유 중" + note : "공유 중지됨";
    }

    function stopSharing() {
      stopTimer();
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      stopFrameReader();
      video.srcObject = null;
      setShareState(false);
      remainingRepeats = 0;
      alertAudio.pause();
      prevFound = false;
      currentFound = false;
      missCount = 0;
      lastAlertAt = 0;
      foundSinceTs = null;
      liveCountInfo.textContent = `감지된 픽셀: 0 px | 스캔주기: ${getCurrentIntervalMs()} ms`;
      stopBlinkLoop();
    }

    colorPicker.addEventListener("input", (e) => {
      const hex = e.target.value.replace("#", "");
      const r = parseInt(hex.slice(0, 2), 16);
      const g = parseInt(hex.slice(2, 4), 16);
      const b = parseInt(hex.slice(4, 6), 16);
      setTargetRgb(r, g, b);
      saveSettings();
    });

    eyedropBtn.addEventListener("click", () => {
      eyedropMode = !eyedropMode;
      eyedropBtn.classList.toggle("active", eyedropMode);
      video.style.cursor = eyedropMode ? "crosshair" : "default";
    });

    intervalInput.addEventListener("input", restartTimer);
    fontRange.addEventListener("input", syncStatusDisplay);

    document.getElementById("startBtn").addEventListener("click", async () => {
      try {
        if (stream) stopSharing(); // 중복 시작 시 이전 스트림 정리
        stream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: { ideal: 30, max: 60 } },
          audio: false
        });
        // 브라우저 상단의 "공유 중지" 버튼으로 끊었을 때도 정리
        stream.getVideoTracks()[0].addEventListener("ended", stopSharing);
        const bgOk = startFrameReader(stream.getVideoTracks()[0]);
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          // 저장/선택된 영역이 있으면 그걸 쓰고, 없으면 기본 영역 적용
          requestAnimationFrame(() => (normRegion ? showRegion() : applyDefaultPxRegion()));
        };
        prevFound = false;
        missCount = 0;
        lastAlertAt = 0;
        restartTimer();
        setShareState(true, bgOk ? "" : " (백그라운드 스캔 불가)");
      } catch (err) {
        console.error(err);
      }
    });

    document.getElementById("stopBtn").addEventListener("click", stopSharing);

    video.addEventListener("click", (e) => {
      if (!eyedropMode || !video.videoWidth) return;
      const rect = video.getBoundingClientRect();
      const nx = (e.clientX - rect.left) / rect.width;
      const ny = (e.clientY - rect.top) / rect.height;
      const vx = Math.max(0, Math.min(video.videoWidth - 1, Math.floor(nx * video.videoWidth)));
      const vy = Math.max(0, Math.min(video.videoHeight - 1, Math.floor(ny * video.videoHeight)));

      scanCanvas.width = video.videoWidth;
      scanCanvas.height = video.videoHeight;
      scanCtx.drawImage(video, 0, 0);
      const px = scanCtx.getImageData(vx, vy, 1, 1).data;
      setTargetRgb(px[0], px[1], px[2]);
      saveSettings();

      eyedropMode = false;
      eyedropBtn.classList.remove("active");
      video.style.cursor = "default";
    });

    // 미리보기를 클릭하면 그 픽셀의 색을 목표 색깔로 지정
    previewCanvas.addEventListener("click", (e) => {
      const cw = previewCanvas.width, ch = previewCanvas.height;
      const rect = previewCanvas.getBoundingClientRect();
      const scale = Math.min(rect.width / cw, rect.height / ch); // object-fit: contain 기준
      const offX = (rect.width - cw * scale) / 2;
      const offY = (rect.height - ch * scale) / 2;
      const x = Math.floor((e.clientX - rect.left - offX) / scale);
      const y = Math.floor((e.clientY - rect.top - offY) / scale);
      if (x < 0 || y < 0 || x >= cw || y >= ch) return;
      const px = previewCtx.getImageData(x, y, 1, 1).data;
      if (px[3] === 0) return; // 아직 화면이 그려지지 않음
      setTargetRgb(px[0], px[1], px[2]);
      saveSettings();
    });

    stageWrap.addEventListener("mousedown", (e) => {
      if (eyedropMode || !video.videoWidth) return;
      const rect = video.getBoundingClientRect();
      dragging = true;
      dragStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      selBox.style.left = `${dragStart.x}px`;
      selBox.style.top = `${dragStart.y}px`;
      selBox.style.width = "0px";
      selBox.style.height = "0px";
      selBox.style.display = "block";
    });

    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      const rect = video.getBoundingClientRect();
      const curX = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
      const curY = Math.max(0, Math.min(rect.height, e.clientY - rect.top));

      const x = Math.min(dragStart.x, curX);
      const y = Math.min(dragStart.y, curY);
      const w = Math.abs(curX - dragStart.x);
      const h = Math.abs(curY - dragStart.y);

      selBox.style.left = `${x}px`;
      selBox.style.top = `${y}px`;
      selBox.style.width = `${w}px`;
      selBox.style.height = `${h}px`;
    });

    window.addEventListener("mouseup", (e) => {
      if (!dragging) return;
      dragging = false;
      const rect = video.getBoundingClientRect();
      const curX = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
      const curY = Math.max(0, Math.min(rect.height, e.clientY - rect.top));

      const x = Math.min(dragStart.x, curX);
      const y = Math.min(dragStart.y, curY);
      const w = Math.abs(curX - dragStart.x);
      const h = Math.abs(curY - dragStart.y);

      if (w > 4 && h > 4) {
        normRegion = {
          x: x / rect.width,
          y: y / rect.height,
          w: w / rect.width,
          h: h / rect.height
        };
        regionInfo.textContent = `선택 영역: (${Math.round(x)}, ${Math.round(y)}) 크기 ${Math.round(w)}x${Math.round(h)}`;
        saveSettings();
      }
    });

    function scanFrame() {
      const ms = getCurrentIntervalMs();
      updateSubText(); // 백그라운드에서도 방치 시간/카운트다운 갱신

      // 가능하면 트랙에서 직접 받은 최신 프레임을 사용, 아니면 <video> 사용
      const src = latestFrame || video;
      const srcW = latestFrame ? latestFrame.displayWidth : video.videoWidth;
      const srcH = latestFrame ? latestFrame.displayHeight : video.videoHeight;
      if (!normRegion || !srcW || (!latestFrame && video.readyState < 2)) {
        liveCountInfo.textContent = `감지된 픽셀: 0 px | 스캔주기: ${ms} ms`;
        return;
      }

      const sx = Math.max(0, Math.floor(normRegion.x * srcW));
      const sy = Math.max(0, Math.floor(normRegion.y * srcH));
      const sw = Math.max(1, Math.floor(normRegion.w * srcW));
      const sh = Math.max(1, Math.floor(normRegion.h * srcH));

      // 크기가 바뀔 때만 대입 (대입하면 캔버스가 초기화/재할당됨)
      if (scanCanvas.width !== sw) scanCanvas.width = sw;
      if (scanCanvas.height !== sh) scanCanvas.height = sh;
      scanCtx.drawImage(src, sx, sy, sw, sh, 0, 0, sw, sh);

      // 선택 영역 미리보기
      if (previewCanvas.width !== sw) previewCanvas.width = sw;
      if (previewCanvas.height !== sh) previewCanvas.height = sh;
      previewCtx.drawImage(scanCanvas, 0, 0);

      const data = scanCtx.getImageData(0, 0, sw, sh).data;
      const tol = Math.max(0, Number(document.getElementById("tolInput").value) || 0);
      const minPx = Math.max(1, Number(document.getElementById("minPxInput").value) || 1);

      let matched = 0;
      for (let i = 0; i < data.length; i += 4) {
        if (
          Math.abs(data[i] - targetRgb[0]) <= tol &&
          Math.abs(data[i + 1] - targetRgb[1]) <= tol &&
          Math.abs(data[i + 2] - targetRgb[2]) <= tol
        ) {
          matched++;
        }
      }

      liveCountInfo.textContent = `감지된 픽셀: ${matched} px | 스캔주기: ${ms} ms`;

      const rawFound = matched >= minPx;
      const now = performance.now();

      // 한두 프레임 감지가 끊겨도 바로 "없음"으로 바꾸지 않음
      if (rawFound) {
        missCount = 0;
      } else if (prevFound) {
        missCount++;
      }
      const found = rawFound || (prevFound && missCount < MISS_TOLERANCE);
      currentFound = found;

      if (found) {
        if (!prevFound) {
          // 새로 감지됨: 즉시 알림 + 재알림 타이머 시작
          lastAlertAt = now;
          foundSinceTs = Date.now();
          nextRuneAt = null;
          startBlinkLoop();
          playSequence(repeatInput.value);
        } else {
          // 계속 감지 중: 간격이 지날 때마다 무제한 재알림 (0이면 끔)
          const remindSec = Number(remindSecInput.value) || 0;
          if (remindSec > 0 && now - lastAlertAt >= Math.max(5, remindSec) * 1000) {
            lastAlertAt = now;
            playSequence(repeatInput.value);
          }
          syncStatusDisplay();
        }
      } else {
        if (prevFound) {
          // 룬이 사라짐 = 해제한 것으로 보고 다음 룬 카운트다운 시작
          foundSinceTs = null;
          nextRuneAt = Date.now() + getCycleMs();
        }
        stopBlinkLoop();
        lastAlertAt = 0;
      }
      prevFound = found;
    }

    // ===== 기본값 / 설정 저장 / 초기화 =====
    const DEFAULTS = {
      color: [212, 109, 240],
      tol: 5,
      minPx: 5,
      interval: 1000,
      font: 56,
      repeat: 2,
      volume: 70,
      remindSec: 30,
      cycleMin: 15
    };
    const SETTINGS_KEY = "runeScannerSettings.v1";
    const NUMBER_FIELDS = {
      tol: "tolInput",
      minPx: "minPxInput",
      interval: "intervalInput",
      font: "fontRange",
      repeat: "repeatInput",
      volume: "volumeRange",
      remindSec: "remindSecInput",
      cycleMin: "cycleMinInput"
    };

    function isValidRegion(r) {
      return !!r && ["x", "y", "w", "h"].every(k => Number.isFinite(r[k])) &&
        r.w > 0 && r.h > 0 && r.x >= 0 && r.y >= 0 && r.x + r.w <= 1.0001 && r.y + r.h <= 1.0001;
    }

    function saveSettings() {
      const data = { color: targetRgb.slice(), region: normRegion };
      for (const [key, id] of Object.entries(NUMBER_FIELDS)) {
        data[key] = Number(document.getElementById(id).value);
      }
      try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(data));
      } catch (err) {
        console.warn("설정 저장 실패:", err);
      }
    }

    function applySettings(src) {
      for (const [key, id] of Object.entries(NUMBER_FIELDS)) {
        const v = Number(src[key]);
        if (src[key] !== null && src[key] !== undefined && Number.isFinite(v)) {
          document.getElementById(id).value = v;
        }
      }
      const c = src.color;
      if (Array.isArray(c) && c.length === 3 && c.every(n => Number.isFinite(Number(n)))) {
        const [r, g, b] = c.map(n => Math.max(0, Math.min(255, Math.round(Number(n)))));
        setTargetRgb(r, g, b);
      }
      applyVolume();
      syncStatusDisplay();
    }

    function loadSettings() {
      let saved = null;
      try {
        saved = JSON.parse(localStorage.getItem(SETTINGS_KEY));
      } catch (err) {
        saved = null;
      }
      applySettings({ ...DEFAULTS, ...(saved || {}) });
      if (saved && isValidRegion(saved.region)) {
        normRegion = saved.region;
        regionInfo.textContent = "선택 영역: 저장된 영역 (공유 시작 시 적용)";
      }
    }

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!confirm("모든 설정을 기본값으로 되돌릴까요?")) return;

      applySettings(DEFAULTS);

      // 선택 영역 → 기본 영역
      normRegion = null;
      selBox.style.display = "none";
      regionInfo.textContent = REGION_INFO_DEFAULT_TEXT;
      if (video.videoWidth) applyDefaultPxRegion();

      // 알림 소리 → 기본 파일
      if (audioObjectUrl) {
        URL.revokeObjectURL(audioObjectUrl);
        audioObjectUrl = null;
      }
      audioFileInput.value = "";
      initDefaultAudio();

      // 스포이드 모드 해제 + 스캔 간격 재적용
      eyedropMode = false;
      eyedropBtn.classList.remove("active");
      video.style.cursor = "default";
      restartTimer();

      saveSettings();
    });

    document.getElementById("cycleStartBtn").addEventListener("click", () => {
      nextRuneAt = Date.now() + getCycleMs();
      updateSubText();
    });
    document.getElementById("cycleClearBtn").addEventListener("click", () => {
      nextRuneAt = null;
      updateSubText();
    });
    setInterval(updateSubText, 500);

    loadSettings();
    Object.values(NUMBER_FIELDS).forEach(id => {
      document.getElementById(id).addEventListener("input", saveSettings);
    });
  </script>
</body>
</html>
